<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Artículos</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --bg2: #eef1f5;
      --bg3: #dde3ea;
      --text: #0f172a;
      --text2: #5b6776;
      --text3: #94a3b8;
      --border: rgba(15,23,42,0.10);
      --border2: rgba(15,23,42,0.22);
      --danger-bg: #fff0f0;
      --danger-border: #ffcccc;
      --danger-text: #cc2936;
      --accent: #1d4ed8;
      --accent-dark: #1e3a8a;
      --accent-light: #dbe7fb;
      --radius-md: 8px;
      --radius-lg: 12px;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --mono: 'SF Mono', 'Fira Code', monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11151c;
        --bg2: #1a212c;
        --bg3: #232c38;
        --text: #eef2f7;
        --text2: #9aa7b8;
        --text3: #5d6b7e;
        --border: rgba(255,255,255,0.10);
        --border2: rgba(255,255,255,0.22);
        --danger-bg: #2a1010;
        --danger-border: #661111;
        --danger-text: #ff6b73;
        --accent: #5b8def;
        --accent-dark: #3f6fd1;
        --accent-light: #1c2c4a;
      }
    }

    body { font-family: var(--font); font-size: 15px; color: var(--text); background: linear-gradient(160deg, var(--bg3), var(--bg2)); min-height: 100vh; }

    .app { max-width: 900px; margin: 0 auto; padding: 1rem; }

    header { background: var(--accent-dark); padding: 0 1rem; margin-bottom: 1.5rem; border-radius: var(--radius-lg); box-shadow: 0 4px 14px rgba(15,23,42,0.18); overflow-x:auto; }
    .tabs { display: flex; gap: 4px; }
    .tab { padding: 14px 18px; border: none; background: none; cursor: pointer; font-size: 14px; color: rgba(255,255,255,0.65); border-bottom: 2px solid transparent; margin-bottom: -1px; font-family: var(--font); display: flex; align-items: center; gap: 6px; white-space:nowrap; }
    .tab.active { color: #ffffff; border-bottom-color: #ffffff; font-weight: 500; }
    .tab:hover:not(.active) { color: #ffffff; }

    .panel { display: none; } .panel.active { display: block; }

    .card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1rem 1.25rem; margin-bottom: 1rem; box-shadow: 0 1px 3px rgba(15,23,42,0.06); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .form-row.full { grid-template-columns: 1fr; }
    .form-row.three { grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    @media(max-width:600px){ .form-row,.form-row.three { grid-template-columns: 1fr; } }

    label { font-size: 13px; color: var(--text2); display: block; margin-bottom: 4px; font-weight: 500; }
    input, select {
      width: 100%; font-family: var(--font); font-size: 14px;
      padding: 8px 12px; border: 0.5px solid var(--border2); border-radius: var(--radius-md);
      background: var(--bg); color: var(--text); outline: none;
    }
    input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }

    .search-wrap { position: relative; margin-bottom: 1rem; }
    .search-wrap i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text3); font-size: 16px; }
    .search-wrap input { padding-left: 36px; }
    .search-clear { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text3); padding: 4px; display: none; }

    .btn { padding: 8px 16px; border: 0.5px solid var(--border2); border-radius: var(--radius-md); background: var(--bg); cursor: pointer; font-size: 14px; font-family: var(--font); color: var(--text); display: inline-flex; align-items: center; gap: 6px; }
    .btn:hover { background: var(--bg2); }
    .btn.primary { background: var(--accent); color: #ffffff; border-color: var(--accent); }
    .btn.primary:hover { background: var(--accent-dark); }
    .btn.danger { color: var(--danger-text); border-color: var(--danger-border); }
    .btn.danger:hover { background: var(--danger-bg); }
    .btn.small { padding: 4px 10px; font-size: 13px; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 8px; }
    h2 { font-size: 18px; font-weight: 600; color: var(--text); }
    h3 { font-size: 16px; font-weight: 500; margin-bottom: 0.75rem; color: var(--accent-dark); }

    .article-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; margin-bottom: 1rem; }
    .article-card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; cursor: pointer; transition: border-color 0.15s, transform 0.1s; box-shadow: 0 1px 3px rgba(15,23,42,0.06); }
    .article-card:hover { border-color: var(--accent); transform: translateY(-1px); }
    .article-img-wrap { width: 100%; height: 130px; background: var(--bg2); display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .article-img-wrap img { width: 100%; height: 130px; object-fit: cover; display: block; }
    .no-img { color: var(--text3); font-size: 13px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .article-info { padding: 10px 12px; }
    .article-key { font-size: 12px; color: var(--accent-dark); font-weight: 600; }
    .article-desc { font-size: 14px; font-weight: 500; margin-top: 2px; color: var(--text); }

    .supplier-block { border: 0.5px solid var(--border); border-radius: var(--radius-md); padding: 12px; margin-bottom: 10px; position: relative; background: var(--bg2); }
    .add-supplier-btn { width: 100%; padding: 10px; border: 0.5px dashed var(--border2); border-radius: var(--radius-md); background: none; cursor: pointer; color: var(--accent-dark); font-size: 14px; font-family: var(--font); display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 500; }
    .add-supplier-btn:hover { background: var(--accent-light); }

    .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.55); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 1rem; }
    .modal { background: var(--bg); border-radius: var(--radius-lg); padding: 1.5rem; width: min(620px, 100%); max-height: 90vh; overflow-y: auto; border: 0.5px solid var(--border); }
    .modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.25rem; }

    .actions { display: flex; gap: 8px; margin-top: 1rem; flex-wrap: wrap; }
    .empty { text-align: center; padding: 3rem 1rem; color: var(--text2); font-size: 14px; }
    .empty i { font-size: 36px; display: block; margin-bottom: 8px; color: var(--text3); }
    .badge { display: inline-block; font-size: 11px; padding: 2px 10px; border-radius: 20px; background: var(--accent-light); color: var(--accent-dark); font-weight: 600; }

    .report-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .report-table th { text-align: left; padding: 8px 12px; font-size: 12px; font-weight: 600; color: #ffffff; border-bottom: 0.5px solid var(--border); background: var(--accent-dark); }
    .report-table td { padding: 9px 12px; border-bottom: 0.5px solid var(--border); }
    .report-table tr:last-child td { border-bottom: none; }
    .report-table tr:hover td { background: var(--bg2); }

    .filter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    @media(max-width:600px){ .filter-grid { grid-template-columns: 1fr; } }
    .filter-actions { display: flex; gap: 8px; margin-bottom: 0.25rem; flex-wrap: wrap; }
    .stat-row { display: flex; gap: 10px; margin-bottom: 1.25rem; flex-wrap: wrap; }
    .stat { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-md); padding: 12px 16px; flex: 1; min-width: 80px; text-align: center; box-shadow: 0 1px 3px rgba(15,23,42,0.05); }
    .stat-num { font-size: 20px; font-weight: 700; color: var(--accent-dark); }
    .stat-lbl { font-size: 12px; color: var(--text2); margin-top: 2px; }

    .upload-btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 16px; border: 0.5px dashed var(--border2); border-radius: var(--radius-md); background: var(--bg2); cursor: pointer; color: var(--accent-dark); font-size: 14px; font-family: var(--font); width: 100%; font-weight: 500; }
    .upload-btn:hover { background: var(--accent-light); }
    .img-preview-wrap { margin-top: 8px; position: relative; }
    .img-preview-wrap img { width: 100%; height: 180px; object-fit: cover; border-radius: var(--radius-md); display: block; }
    .img-remove { position: absolute; top: 6px; right: 6px; background: var(--bg); border: 0.5px solid var(--border2); border-radius: var(--radius-md); padding: 4px 10px; cursor: pointer; font-size: 12px; font-family: var(--font); color: var(--danger-text); display: flex; align-items: center; gap: 4px; }

    .confirm-box { background: var(--danger-bg); border: 0.5px solid var(--danger-border); border-radius: var(--radius-md); padding: 12px 16px; margin-top: 1rem; display: none; }
    .confirm-box p { font-size: 14px; color: var(--danger-text); margin-bottom: 10px; }
    .confirm-box .confirm-btns { display: flex; gap: 8px; }
    .form-error { color: var(--danger-text); font-size: 13px; margin-top: 8px; display: none; }
    .export-error { color: var(--danger-text); font-size: 13px; margin-top: 8px; display: none; }

    .export-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 0.75rem; }
    .photo-report-item { display: flex; gap: 14px; border: 0.5px solid var(--border); border-radius: var(--radius-md); padding: 12px; margin-bottom: 10px; background: var(--bg); }
    .photo-report-item img { width: 90px; height: 90px; object-fit: cover; border-radius: var(--radius-md); flex-shrink: 0; background: var(--bg2); }
    .photo-report-item .no-img-sm { width: 90px; height: 90px; border-radius: var(--radius-md); background: var(--bg2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--text3); font-size: 11px; }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="tabs">
      <button class="tab active" id="tab-catalogo" onclick="goTab('catalogo')"><i class="ti ti-photo"></i> Catálogo</button>
      <button class="tab" id="tab-articulo" onclick="goTab('articulo')"><i class="ti ti-plus"></i> Nuevo artículo</button>
      <button class="tab" id="tab-reporte" onclick="goTab('reporte')"><i class="ti ti-table"></i> Reporte</button>
      <button class="tab" id="tab-fotos" onclick="goTab('fotos')"><i class="ti ti-images"></i> Reporte con fotos</button>
    </div>
  </header>

  <!-- CATÁLOGO -->
  <div id="panel-catalogo" class="panel active">
    <div class="section-header">
      <h2>Catálogo de artículos</h2>
      <span id="cat-stats" class="badge"></span>
    </div>
    <div class="search-wrap">
      <i class="ti ti-search"></i>
      <input type="text" id="catalog-search" placeholder="Buscar por descripción..." oninput="renderCatalogo()">
      <button class="search-clear" id="search-clear-btn" onclick="clearCatalogSearch()"><i class="ti ti-x"></i></button>
    </div>
    <div id="article-grid" class="article-grid"></div>
    <div id="empty-cat" class="empty" style="display:none">
      <i class="ti ti-photo-off"></i>
      <span id="empty-cat-text">No hay artículos aún. Agrega uno desde "Nuevo artículo".</span>
    </div>
  </div>

  <!-- FORMULARIO -->
  <div id="panel-articulo" class="panel">
    <div class="section-header">
      <h2 id="form-title">Nuevo artículo</h2>
    </div>
    <div class="card">
      <h3>Datos del artículo</h3>
      <div class="form-row">
        <div><label>Clave *</label><input type="text" id="art-key" placeholder="Ej: ART-001"></div>
        <div><label>Descripción *</label><input type="text" id="art-desc" placeholder="Nombre del artículo"></div>
      </div>
      <div class="form-row full">
        <label>Foto del artículo</label>
        <button class="upload-btn" onclick="document.getElementById('file-input').click()">
          <i class="ti ti-upload"></i> Seleccionar imagen desde tu dispositivo
        </button>
        <input type="file" id="file-input" accept="image/*" style="display:none" onchange="onFileChange(event)">
        <div id="img-preview-wrap" class="img-preview-wrap" style="display:none">
          <img id="img-preview" src="" alt="Vista previa">
          <button class="img-remove" onclick="removeImg()"><i class="ti ti-x"></i> Quitar</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h3>Proveedores</h3>
      <div id="suppliers-list"></div>
      <button class="add-supplier-btn" onclick="addSupplier(null)">
        <i class="ti ti-plus"></i> Agregar proveedor
      </button>
    </div>

    <div class="actions">
      <button class="btn primary" onclick="saveArticle()"><i class="ti ti-check"></i> Guardar artículo</button>
      <button class="btn" onclick="cancelForm()">Cancelar</button>
      <button class="btn danger" id="btn-delete" style="display:none" onclick="showDeleteConfirm()"><i class="ti ti-trash"></i> Eliminar artículo</button>
    </div>
    <div class="confirm-box" id="confirm-box">
      <p>¿Seguro que deseas eliminar este artículo? Esta acción no se puede deshacer.</p>
      <div class="confirm-btns">
        <button class="btn danger" onclick="confirmDelete()"><i class="ti ti-trash"></i> Sí, eliminar</button>
        <button class="btn" onclick="hideDeleteConfirm()">Cancelar</button>
      </div>
    </div>
    <p class="form-error" id="form-error"></p>
  </div>

  <!-- REPORTE -->
  <div id="panel-reporte" class="panel">
    <div class="section-header"><h2>Reporte</h2></div>
    <div class="card">
      <div class="filter-grid">
        <div><label>Proveedor</label>
          <select id="filter-supplier" onchange="renderReport()"><option value="">— Todos —</option></select>
        </div>
        <div><label>Artículo</label>
          <select id="filter-article" onchange="renderReport()"><option value="">— Todos —</option></select>
        </div>
      </div>
      <div class="filter-actions">
        <button class="btn small" onclick="clearFilters()"><i class="ti ti-x"></i> Limpiar filtros</button>
        <button class="btn small" onclick="printReport()"><i class="ti ti-printer"></i> Imprimir</button>
      </div>
      <div class="export-row">
        <button class="btn small primary" id="btn-excel" onclick="exportExcel()"><i class="ti ti-file-spreadsheet"></i> Descargar Excel</button>
        <button class="btn small primary" id="btn-pdf-report" onclick="exportReportPDF()"><i class="ti ti-file-type-pdf"></i> Descargar PDF</button>
      </div>
      <p class="export-error" id="export-error-report"></p>
    </div>
    <div id="report-stats" class="stat-row" style="display:none"></div>
    <div id="report-container"></div>
  </div>

  <!-- REPORTE CON FOTOS -->
  <div id="panel-fotos" class="panel">
    <div class="section-header"><h2>Reporte con fotos</h2></div>
    <div class="card">
      <div class="filter-grid">
        <div><label>Buscar artículo</label>
          <input type="text" id="photos-search" placeholder="Nombre del artículo..." oninput="renderPhotosReport()">
        </div>
        <div><label>Proveedor</label>
          <select id="photos-filter-supplier" onchange="renderPhotosReport()"><option value="">— Todos —</option></select>
        </div>
      </div>
      <div class="filter-actions">
        <button class="btn small" onclick="clearPhotosFilters()"><i class="ti ti-x"></i> Limpiar filtros</button>
      </div>
      <div class="export-row">
        <button class="btn small primary" id="btn-pdf-photos" onclick="exportPhotosPDF()"><i class="ti ti-file-type-pdf"></i> Descargar PDF con fotos</button>
      </div>
      <p class="export-error" id="export-error-photos"></p>
    </div>
    <div id="photos-report-container"></div>
  </div>
</div>

<!-- MODAL -->
<div id="modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-content"></div>
</div>

<script>
const SK = 'catalogo_articulos_v1';
let articles = [], editingId = null, supCount = 0, currentImg = null;

function loadData() {
  try { const d = localStorage.getItem(SK); if (d) articles = JSON.parse(d); } catch(e) {}
  renderCatalogo(); updateReportFilters(); updatePhotosFilters();
}
function saveData() {
  try { localStorage.setItem(SK, JSON.stringify(articles)); } catch(e) {}
}

function goTab(tab) {
  if (tab === 'articulo') { newForm(); return; }
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.getElementById('panel-' + tab).classList.add('active');
  if (tab === 'reporte') renderReport();
  if (tab === 'catalogo') renderCatalogo();
  if (tab === 'fotos') { updatePhotosFilters(); renderPhotosReport(); }
}
function setTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.getElementById('panel-' + tab).classList.add('active');
}

function onFileChange(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    currentImg = ev.target.result;
    document.getElementById('img-preview').src = currentImg;
    document.getElementById('img-preview-wrap').style.display = 'block';
  };
  reader.readAsDataURL(file);
}
function removeImg() {
  currentImg = null;
  document.getElementById('file-input').value = '';
  document.getElementById('img-preview').src = '';
  document.getElementById('img-preview-wrap').style.display = 'none';
}

function clearCatalogSearch() {
  document.getElementById('catalog-search').value = '';
  renderCatalogo();
}

function renderCatalogo() {
  const grid = document.getElementById('article-grid');
  const empty = document.getElementById('empty-cat');
  const emptyText = document.getElementById('empty-cat-text');
  const stats = document.getElementById('cat-stats');
  const searchInput = document.getElementById('catalog-search');
  const query = searchInput.value.trim().toLowerCase();
  document.getElementById('search-clear-btn').style.display = query ? 'block' : 'none';

  if (!articles.length) {
    grid.innerHTML = ''; empty.style.display = 'block'; stats.textContent = '';
    emptyText.textContent = 'No hay artículos aún. Agrega uno desde "Nuevo artículo".';
    return;
  }

  const filtered = query
    ? articles.filter(a => a.desc.toLowerCase().includes(query) || a.key.toLowerCase().includes(query))
    : articles;

  if (!filtered.length) {
    grid.innerHTML = ''; empty.style.display = 'block';
    emptyText.textContent = `No se encontraron artículos que coincidan con "${searchInput.value.trim()}".`;
    stats.textContent = '0 resultados';
    return;
  }

  empty.style.display = 'none';
  stats.textContent = query
    ? `${filtered.length} resultado${filtered.length !== 1 ? 's' : ''} de ${articles.length}`
    : articles.length + ' artículo' + (articles.length !== 1 ? 's' : '');

  grid.innerHTML = filtered.map(a => `
    <div class="article-card" onclick="showDetail('${a.id}')">
      <div class="article-img-wrap">
        ${a.img
          ? `<img src="${a.img}" alt="${esc(a.desc)}" onerror="this.parentNode.innerHTML='<div class=no-img><i class=ti style=font-size:28px></i><span style=font-size:12px>Sin foto</span></div>'">`
          : `<div class="no-img"><i class="ti ti-photo-off" style="font-size:28px"></i><span style="font-size:12px">Sin foto</span></div>`}
      </div>
      <div class="article-info">
        <div class="article-key">${esc(a.key)}</div>
        <div class="article-desc">${esc(a.desc)}</div>
        <div style="margin-top:6px"><span class="badge">${a.suppliers.length} prov.</span></div>
      </div>
    </div>`).join('');
}

function showDetail(id) {
  const a = articles.find(x => x.id === id); if (!a) return;
  document.getElementById('modal-content').innerHTML = `
    <div class="modal-header">
      <div>
        <div style="font-size:12px;color:var(--text2);font-weight:500">${esc(a.key)}</div>
        <h3 style="margin:0">${esc(a.desc)}</h3>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn small" onclick="editArticle('${a.id}')"><i class="ti ti-edit"></i> Editar</button>
        <button class="btn small" onclick="closeModal()"><i class="ti ti-x"></i></button>
      </div>
    </div>
    ${a.img ? `<img src="${a.img}" alt="${esc(a.desc)}" style="width:100%;height:200px;object-fit:cover;border-radius:var(--radius-md);margin-bottom:1rem" onerror="this.style.display='none'">` : ''}
    <h3 style="margin-bottom:0.75rem">Proveedores (${a.suppliers.length})</h3>
    ${a.suppliers.length ? a.suppliers.map(s => `
      <div style="border:0.5px solid var(--border);border-radius:var(--radius-md);padding:12px;margin-bottom:8px;background:var(--bg2)">
        <div style="font-weight:500;margin-bottom:8px">${esc(s.name)}</div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;font-size:13px">
          <div><div style="color:var(--text2)">Clave-Artículo</div><div style="font-family:var(--mono)">${esc(s.artKey || '-')}</div></div>
          <div><div style="color:var(--text2)">Precio de venta</div><div style="font-weight:600;color:var(--accent-dark)">$${Number(s.price || 0).toLocaleString('es-MX', {minimumFractionDigits:2,maximumFractionDigits:2})}</div></div>
          <div><div style="color:var(--text2)">Nota</div><div>${esc(s.note || '-')}</div></div>
        </div>
      </div>`).join('')
    : '<div style="color:var(--text2);font-size:14px">Sin proveedores.</div>'}`;
  document.getElementById('modal').style.display = 'flex';
}
function closeModal() { document.getElementById('modal').style.display = 'none'; }

function newForm() {
  editingId = null; supCount = 0; currentImg = null;
  document.getElementById('form-title').textContent = 'Nuevo artículo';
  document.getElementById('art-key').value = '';
  document.getElementById('art-desc').value = '';
  document.getElementById('file-input').value = '';
  document.getElementById('img-preview-wrap').style.display = 'none';
  document.getElementById('img-preview').src = '';
  document.getElementById('btn-delete').style.display = 'none';
  document.getElementById('form-error').style.display = 'none';
  document.getElementById('confirm-box').style.display = 'none';
  document.getElementById('suppliers-list').innerHTML = '';
  setTab('articulo');
}

function editArticle(id) {
  closeModal();
  const a = articles.find(x => x.id === id); if (!a) return;
  editingId = id; supCount = 0; currentImg = a.img || null;
  document.getElementById('form-title').textContent = 'Editar artículo';
  document.getElementById('art-key').value = a.key;
  document.getElementById('art-desc').value = a.desc;
  document.getElementById('file-input').value = '';
  if (a.img) { document.getElementById('img-preview').src = a.img; document.getElementById('img-preview-wrap').style.display = 'block'; }
  else document.getElementById('img-preview-wrap').style.display = 'none';
  document.getElementById('btn-delete').style.display = 'block';
  document.getElementById('form-error').style.display = 'none';
  document.getElementById('confirm-box').style.display = 'none';
  document.getElementById('suppliers-list').innerHTML = '';
  a.suppliers.forEach(s => addSupplier(s));
  setTab('articulo');
}

function addSupplier(data) {
  supCount++;
  const id = 's' + supCount;
  const div = document.createElement('div');
  div.className = 'supplier-block'; div.id = id;
  div.innerHTML = `
    <button class="btn small danger" style="position:absolute;top:8px;right:8px" onclick="document.getElementById('${id}').remove()"><i class="ti ti-x"></i></button>
    <div style="font-size:12px;color:var(--text2);font-weight:500;margin-bottom:10px">Proveedor ${supCount}</div>
    <div class="form-row full" style="margin-bottom:12px">
      <div><label>Nombre *</label><input type="text" placeholder="Nombre del proveedor" value="${esc(data ? data.name : '')}"></div>
    </div>
    <div class="form-row three">
      <div><label>Clave-Artículo</label><input type="text" placeholder="Clave del proveedor" value="${esc(data ? data.artKey : '')}"></div>
      <div><label>Precio de venta</label><input type="number" placeholder="0.00" step="0.01" min="0" value="${data && data.price ? data.price : ''}"></div>
      <div><label>Nota</label><input type="text" placeholder="Observación" value="${esc(data ? data.note : '')}"></div>
    </div>`;
  document.getElementById('suppliers-list').appendChild(div);
}

function getSuppliers() {
  const suppliers = [];
  document.getElementById('suppliers-list').querySelectorAll('.supplier-block').forEach(b => {
    const inp = b.querySelectorAll('input');
    const name = inp[0].value.trim();
    if (name) suppliers.push({ name, artKey: inp[1].value.trim(), price: parseFloat(inp[2].value) || 0, note: inp[3].value.trim() });
  });
  return suppliers;
}

function saveArticle() {
  const key = document.getElementById('art-key').value.trim();
  const desc = document.getElementById('art-desc').value.trim();
  const err = document.getElementById('form-error');
  if (!key || !desc) { err.textContent = 'La clave y descripción son obligatorias.'; err.style.display = 'block'; return; }
  err.style.display = 'none';
  const suppliers = getSuppliers(), img = currentImg || null;
  if (editingId) { const i = articles.findIndex(x => x.id === editingId); if (i > -1) articles[i] = { ...articles[i], key, desc, img, suppliers }; }
  else articles.push({ id: 'a' + Date.now(), key, desc, img, suppliers });
  saveData(); editingId = null;
  setTab('catalogo'); renderCatalogo(); updateReportFilters(); updatePhotosFilters();
}

function showDeleteConfirm() { document.getElementById('confirm-box').style.display = 'block'; }
function hideDeleteConfirm() { document.getElementById('confirm-box').style.display = 'none'; }
function confirmDelete() {
  if (!editingId) return;
  articles = articles.filter(x => x.id !== editingId);
  saveData(); editingId = null;
  setTab('catalogo'); renderCatalogo(); updateReportFilters(); updatePhotosFilters();
}
function cancelForm() { editingId = null; setTab('catalogo'); }

function updateReportFilters() {
  const selSup = document.getElementById('filter-supplier');
  const selArt = document.getElementById('filter-article');
  const curSup = selSup.value, curArt = selArt.value;
  const suppliers = [...new Set(articles.flatMap(a => a.suppliers.map(s => s.name)))].sort();
  const artNames = [...new Set(articles.map(a => a.desc))].sort();
  selSup.innerHTML = '<option value="">— Todos —</option>' + suppliers.map(n => `<option value="${esc(n)}"${n === curSup ? ' selected' : ''}>${esc(n)}</option>`).join('');
  selArt.innerHTML = '<option value="">— Todos —</option>' + artNames.map(n => `<option value="${esc(n)}"${n === curArt ? ' selected' : ''}>${esc(n)}</option>`).join('');
}

function clearFilters() {
  document.getElementById('filter-supplier').value = '';
  document.getElementById('filter-article').value = '';
  renderReport();
}

function getReportRows() {
  const filterSup = document.getElementById('filter-supplier').value;
  const filterArt = document.getElementById('filter-article').value;
  let rows = [];
  articles.forEach(a => {
    if (filterArt && a.desc !== filterArt) return;
    a.suppliers.forEach(s => {
      if (!filterSup || s.name === filterSup)
        rows.push({ artKey: a.key, artDesc: a.desc, supName: s.name, supArtKey: s.artKey, price: s.price, note: s.note });
    });
  });
  rows.sort((a, b) => a.supName.localeCompare(b.supName) || a.artKey.localeCompare(b.artKey));
  return rows;
}

function renderReport() {
  const rows = getReportRows();
  const statsDiv = document.getElementById('report-stats'), container = document.getElementById('report-container');
  if (!rows.length) { statsDiv.style.display = 'none'; container.innerHTML = '<div class="empty"><i class="ti ti-table-off" style="font-size:36px"></i>Sin datos para los filtros seleccionados.</div>'; return; }
  const uArts = [...new Set(rows.map(r => r.artKey))].length;
  const uSups = [...new Set(rows.map(r => r.supName))].length;
  const avg = rows.reduce((s, r) => s + r.price, 0) / rows.length;
  statsDiv.style.display = 'flex';
  statsDiv.innerHTML = `
    <div class="stat"><div class="stat-num">${rows.length}</div><div class="stat-lbl">Registros</div></div>
    <div class="stat"><div class="stat-num">${uArts}</div><div class="stat-lbl">Artículos</div></div>
    <div class="stat"><div class="stat-num">${uSups}</div><div class="stat-lbl">Proveedores</div></div>
    <div class="stat"><div class="stat-num">$${avg.toLocaleString('es-MX', {minimumFractionDigits:2,maximumFractionDigits:2})}</div><div class="stat-lbl">Precio prom.</div></div>`;
  container.innerHTML = `<div style="overflow-x:auto"><table class="report-table">
    <thead><tr><th>Clave artículo</th><th>Descripción</th><th>Proveedor</th><th>Clave-Artículo prov.</th><th style="text-align:right">Precio</th><th>Nota</th></tr></thead>
    <tbody>${rows.map(r => `<tr>
      <td style="font-family:var(--mono);font-size:13px;font-weight:500">${esc(r.artKey)}</td>
      <td>${esc(r.artDesc)}</td><td>${esc(r.supName)}</td>
      <td style="font-family:var(--mono);font-size:13px">${esc(r.supArtKey || '-')}</td>
      <td style="text-align:right;font-weight:600;color:var(--accent-dark)">$${Number(r.price).toLocaleString('es-MX', {minimumFractionDigits:2,maximumFractionDigits:2})}</td>
      <td style="color:var(--text2);font-size:13px">${esc(r.note || '-')}</td>
    </tr>`).join('')}</tbody></table></div>`;
}

function printReport() {
  const html = document.getElementById('report-container').innerHTML;
  const sup = document.getElementById('filter-supplier').value;
  const art = document.getElementById('filter-article').value;
  let title = 'Reporte de artículos';
  if (sup && art) title += ` — ${sup} / ${art}`;
  else if (sup) title += ` — Proveedor: ${sup}`;
  else if (art) title += ` — Artículo: ${art}`;
  const w = window.open('', '_blank');
  w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${title}</title>
  <style>body{font-family:sans-serif;font-size:13px;padding:20px}h1{font-size:18px;margin-bottom:4px}p{color:#666;margin-bottom:16px}table{width:100%;border-collapse:collapse}th{text-align:left;padding:7px 10px;font-size:12px;background:#1d4ed8;color:#fff;border-bottom:1px solid #ddd}td{padding:7px 10px;border-bottom:0.5px solid #eee}</style>
  </head><body><h1>${title}</h1><p>${new Date().toLocaleDateString('es-MX', {year:'numeric',month:'long',day:'numeric'})}</p>${html}</body></html>`);
  w.document.close(); w.focus(); setTimeout(() => w.print(), 300);
}

function showExportError(elId, msg) {
  const el = document.getElementById(elId);
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 6000);
}

function exportExcel() {
  const errEl = document.getElementById('export-error-report');
  errEl.style.display = 'none';
  try {
    if (typeof XLSX === 'undefined') { showExportError('export-error-report', 'No se pudo cargar la librería de Excel. Verifica tu conexión a internet e intenta de nuevo.'); return; }
    const rows = getReportRows();
    if (!rows.length) { showExportError('export-error-report', 'No hay datos para exportar con los filtros actuales.'); return; }
    const data = rows.map(r => ({
      'Clave artículo': r.artKey,
      'Descripción': r.artDesc,
      'Proveedor': r.supName,
      'Clave-Artículo proveedor': r.supArtKey || '',
      'Precio de venta': r.price,
      'Nota': r.note || ''
    }));
    const ws = XLSX.utils.json_to_sheet(data);
    ws['!cols'] = [{wch:16},{wch:30},{wch:22},{wch:20},{wch:14},{wch:30}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Reporte');
    XLSX.writeFile(wb, 'reporte_articulos_' + new Date().toISOString().slice(0,10) + '.xlsx');
  } catch (e) {
    console.error('Error exportando Excel:', e);
    showExportError('export-error-report', 'Ocurrió un error al generar el Excel: ' + e.message);
  }
}

function getJsPDF() {
  if (window.jspdf && window.jspdf.jsPDF) return window.jspdf.jsPDF;
  if (typeof jsPDF !== 'undefined') return jsPDF;
  return null;
}

function exportReportPDF() {
  const errEl = 'export-error-report';
  document.getElementById(errEl).style.display = 'none';
  try {
    const JsPDFCtor = getJsPDF();
    if (!JsPDFCtor) { showExportError(errEl, 'No se pudo cargar la librería de PDF. Verifica tu conexión a internet y recarga la página.'); return; }
    const rows = getReportRows();
    if (!rows.length) { showExportError(errEl, 'No hay datos para exportar con los filtros actuales.'); return; }

    const doc = new JsPDFCtor({ orientation: 'landscape', unit: 'pt', format: 'a4' });
    doc.setFontSize(16); doc.setTextColor(29,78,216);
    doc.text('Reporte de artículos por proveedor', 40, 40);
    doc.setFontSize(10); doc.setTextColor(100);
    doc.text(new Date().toLocaleDateString('es-MX', {year:'numeric',month:'long',day:'numeric'}), 40, 58);

    const headers = ['Clave artículo','Descripción','Proveedor','Clave-Art. prov.','Precio','Nota'];
    const colX = [40, 140, 320, 460, 580, 650];
    let y = 90;
    doc.setFillColor(29,78,216); doc.rect(40, y-14, 760, 20, 'F');
    doc.setTextColor(255); doc.setFontSize(9);
    headers.forEach((h,i)=>doc.text(h, colX[i], y));
    y += 14;
    doc.setTextColor(20); doc.setFontSize(9);
    rows.forEach((r,idx) => {
      if (y > 540) { doc.addPage(); y = 50; }
      if (idx % 2 === 0) { doc.setFillColor(238,241,245); doc.rect(40, y-10, 760, 16, 'F'); }
      doc.text(String(r.artKey||'').slice(0,16), colX[0], y);
      doc.text(String(r.artDesc||'').slice(0,28), colX[1], y);
      doc.text(String(r.supName||'').slice(0,20), colX[2], y);
      doc.text(String(r.supArtKey||'-').slice(0,16), colX[3], y);
      doc.text('$' + Number(r.price||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2}), colX[4], y);
      doc.text(String(r.note||'-').slice(0,20), colX[5], y);
      y += 16;
    });
    doc.save('reporte_articulos_' + new Date().toISOString().slice(0,10) + '.pdf');
  } catch (e) {
    console.error('Error exportando PDF:', e);
    showExportError(errEl, 'Ocurrió un error al generar el PDF: ' + e.message);
  }
}

function updatePhotosFilters() {
  const sel = document.getElementById('photos-filter-supplier');
  const cur = sel.value;
  const suppliers = [...new Set(articles.flatMap(a => a.suppliers.map(s => s.name)))].sort();
  sel.innerHTML = '<option value="">— Todos —</option>' + suppliers.map(n => `<option value="${esc(n)}"${n === cur ? ' selected' : ''}>${esc(n)}</option>`).join('');
}

function clearPhotosFilters() {
  document.getElementById('photos-search').value = '';
  document.getElementById('photos-filter-supplier').value = '';
  renderPhotosReport();
}

function getFilteredPhotoArticles() {
  const query = document.getElementById('photos-search').value.trim().toLowerCase();
  const supplier = document.getElementById('photos-filter-supplier').value;
  return articles.filter(a => {
    if (query && !a.desc.toLowerCase().includes(query)) return false;
    if (supplier && !a.suppliers.some(s => s.name === supplier)) return false;
    return true;
  });
}

function renderPhotosReport() {
  const container = document.getElementById('photos-report-container');
  if (!articles.length) { container.innerHTML = '<div class="empty"><i class="ti ti-photo-off" style="font-size:36px"></i>No hay artículos en el catálogo.</div>'; return; }
  const filtered = getFilteredPhotoArticles();
  if (!filtered.length) { container.innerHTML = '<div class="empty"><i class="ti ti-photo-off" style="font-size:36px"></i>Sin artículos para los filtros seleccionados.</div>'; return; }
  container.innerHTML = filtered.map(a => `
    <div class="photo-report-item">
      ${a.img ? `<img src="${a.img}" alt="${esc(a.desc)}">` : `<div class="no-img-sm">Sin foto</div>`}
      <div style="flex:1;min-width:0">
        <div style="font-size:12px;color:var(--accent-dark);font-weight:600">${esc(a.key)}</div>
        <div style="font-weight:500;margin-bottom:6px">${esc(a.desc)}</div>
        ${a.suppliers.length ? `<div style="font-size:13px;color:var(--text2)">
          ${a.suppliers.map(s=>`<div>${esc(s.name)} — $${Number(s.price||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2})}${s.artKey?` (Clave: ${esc(s.artKey)})`:''}</div>`).join('')}
        </div>` : `<div style="font-size:13px;color:var(--text3)">Sin proveedores</div>`}
      </div>
    </div>`).join('');
}

function detectImageFormat(dataUrl) {
  if (!dataUrl || typeof dataUrl !== 'string') return null;
  const match = dataUrl.match(/^data:image\/(png|jpe?g|webp|gif)/i);
  if (!match) return null;
  const type = match[1].toLowerCase();
  if (type === 'png') return 'PNG';
  if (type === 'jpg' || type === 'jpeg') return 'JPEG';
  return null; // jsPDF only reliably supports PNG/JPEG
}

function exportPhotosPDF() {
  const errEl = 'export-error-photos';
  document.getElementById(errEl).style.display = 'none';
  try {
    const JsPDFCtor = getJsPDF();
    if (!JsPDFCtor) { showExportError(errEl, 'No se pudo cargar la librería de PDF. Verifica tu conexión a internet y recarga la página.'); return; }
    if (!articles.length) { showExportError(errEl, 'No hay artículos en el catálogo.'); return; }
    const filtered = getFilteredPhotoArticles();
    if (!filtered.length) { showExportError(errEl, 'No hay artículos para los filtros actuales.'); return; }

    const query = document.getElementById('photos-search').value.trim();
    const supplier = document.getElementById('photos-filter-supplier').value;
    let title = 'Reporte de artículos con fotos';
    if (query && supplier) title += ` — "${query}" / ${supplier}`;
    else if (query) title += ` — "${query}"`;
    else if (supplier) title += ` — Proveedor: ${supplier}`;

    const doc = new JsPDFCtor({ orientation: 'portrait', unit: 'pt', format: 'a4' });
    doc.setFontSize(16); doc.setTextColor(29,78,216);
    doc.text(title, 40, 40);
    doc.setFontSize(10); doc.setTextColor(100);
    doc.text(new Date().toLocaleDateString('es-MX', {year:'numeric',month:'long',day:'numeric'}), 40, 58);

    let y = 85;
    filtered.forEach(a => {
      if (y > 680) { doc.addPage(); y = 50; }
      const boxH = 95;
      doc.setDrawColor(220); doc.roundedRect(40, y, 515, boxH, 4, 4);

      const fmt = detectImageFormat(a.img);
      if (a.img && fmt) {
        try { doc.addImage(a.img, fmt, 48, y+8, 80, 80); }
        catch(imgErr) {
          console.warn('No se pudo incrustar imagen de', a.key, imgErr);
          doc.setFillColor(238,241,245); doc.rect(48, y+8, 80, 80, 'F');
          doc.setFontSize(8); doc.setTextColor(150); doc.text('Imagen no', 58, y+46); doc.text('compatible', 56, y+58);
        }
      } else {
        doc.setFillColor(238,241,245); doc.rect(48, y+8, 80, 80, 'F');
        doc.setFontSize(8); doc.setTextColor(150);
        doc.text('Sin foto', 60, y+50);
      }

      doc.setFontSize(11); doc.setTextColor(29,78,216);
      doc.text(String(a.key||''), 140, y+20);
      doc.setFontSize(12); doc.setTextColor(20);
      doc.text(String(a.desc||'').slice(0,45), 140, y+36);
      doc.setFontSize(9); doc.setTextColor(90);
      let sy = y + 52;
      if (a.suppliers.length) {
        a.suppliers.slice(0,4).forEach(s => {
          const line = `${s.name} — $${Number(s.price||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2})}${s.artKey ? ' (Clave: ' + s.artKey + ')' : ''}`;
          doc.text(line.slice(0,70), 140, sy);
          sy += 12;
        });
      } else {
        doc.text('Sin proveedores registrados', 140, sy);
      }
      y += boxH + 12;
    });
    doc.save('reporte_fotos_articulos_' + new Date().toISOString().slice(0,10) + '.pdf');
  } catch (e) {
    console.error('Error exportando PDF con fotos:', e);
    showExportError(errEl, 'Ocurrió un error al generar el PDF: ' + e.message);
  }
}

function esc(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

loadData();
</script>
</body>
</html>
